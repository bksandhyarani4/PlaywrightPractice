# Name shown in the "Actions" tab on GitHub.
name: CI/CD

# WHEN should this pipeline run?
on:
  push:
    branches: [main]        # every time code is pushed to main
  pull_request:
    branches: [main]        # every pull request that targets main
  workflow_dispatch:        # lets you start it manually with a button in the Actions tab

# WHAT should it do? A pipeline is made of jobs; each job is made of steps.
jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest  # GitHub gives us a fresh, empty Linux machine for every run
    timeout-minutes: 20     # stop the job if it hangs

    steps:
      # 1. Download your repo's code onto the fresh machine.
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Node.js (and cache npm downloads so later runs are faster).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install the packages listed in package-lock.json (exact versions, clean install).
      - name: Install dependencies
        run: npm ci

      # 4. Download the Chromium browser Playwright drives (plus Linux libraries it needs).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 5. Run the tests. If any test fails, this step fails and the pipeline turns red.
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Save the HTML report so you can download it from the run page.
      #    "!cancelled()" = upload it even when tests failed (that's when you need it most).
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
